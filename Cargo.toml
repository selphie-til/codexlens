[package]
name = "codexlens"
# Development placeholder; release builds stamp the version from the tag.
version = "0.0.0"
edition = "2024"
description = "A lens onto your Codex usage: where time, tokens, and effort go, and which config to fix"
repository = "https://github.com/selphie-til/codexlens"
license = "MIT"
readme = "README.md"
keywords = ["codex", "codex-cli", "usage", "analytics", "cli"]
categories = ["command-line-utilities", "development-tools"]
# The crate is the Rust program. Everything that only serves someone working in
# the repository — the dev shell, the task runner, the toolchain pin, the CI
# definitions, the contributor guide, the project's own Codex rules and the
# plugin marketplace — is furniture a downloaded package cannot act on, so it
# stays out of the tarball. `docs/specs/` is the exception: the README links into
# it, and it is what explains the code.
exclude = [
  ".claude/",
  ".github/",
  "skills/",
  "AGENTS.md",
  "flake.lock",
  "flake.nix",
  "justfile",
  "rust-toolchain.toml",
]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.1", features = ["derive"] }
# Pinned to 0.32: newer rusqlite pulls libsqlite3-sys >= 0.38, whose build
# script uses the still-unstable `cfg_select` feature and so fails on stable
# Rust (confirmed on 1.93). Revisit once libsqlite3-sys drops it / it stabilizes.
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

toml = "0.8"
